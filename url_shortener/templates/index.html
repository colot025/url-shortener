<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <title>URL Shortener</title>
</head>
<body>
    <div class="container my-5">
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
                <div class="alert-container mb-4">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('shortener.create_link') }}" style="max-width: 800px; margin: 50px auto;">
            <div class="form-group mb-3">
                <label for="original-url" style="font-size: 28px;">Original URL</label>
                <input type="text" class="form-control" placeholder="Enter URL" name="original_url" />
            </div>
            <div class="form-group mb-3">
                <label for="custom-id" style="font-size: 28px;">Custom Short ID</label>
                <input type="text" class="form-control" placeholder="Want to customize? (optional)" name="custom_id" />
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-NFjbhb9nd0/zfQlQfTDEOj70yLZ7tGBONvlLvRyxC4Tgo9J6ET0wxdGVC8F39jBC" crossorigin="anonymous"></script>
</body>
</html>
