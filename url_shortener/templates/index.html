<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

<form method="POST" action="{{ url_for('shortener.create_link')}}" style="max-width: 800px; margin: 50px;">
<div class="form-group">
    <label for="original-url" style="font-size: 28px;">
        Original URL
    </label>
    <input type="text" class="form-control" placeholder="Enter URL" name="original_url" />
</div>
<div class="form-group">
    <label for="custom-id" style="font-size: 28px;">
        Custom Short ID
    </label>
    <input type="text" class="form-control" placeholder="Want to customise? (optional)" name="custom_id" />
</div>
<button type="submit" class="btn btn-primary">Submit</button>

</form>
