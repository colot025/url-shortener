<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" 
        crossorigin="anonymous">
    <title>Shortened URL</title>
</head>
<body class="bg-light">
    <div class="container my-5">
        <!-- Display Original URL -->
        <div class="mb-3">
            <p class="text-left p-3 rounded bg-primary text-white" style="font-size: 1.2rem; max-width: 800px;">
                Original URL: 
                <a href="{{ original_url }}" target="_blank" class="text-white text-decoration-none">
                    {{ original_url }}
                </a>
            </p>
        </div>

        <!-- Display Shortened URL -->
        <div class="mb-3">
            <p class="text-left p-3 rounded bg-secondary text-white" style="font-size: 1.2rem; max-width: 800px;">
                Shortened URL: 
                <a href="{{ url_for('shortener.redirect_to_url', short_url=new_url, _external=True) }}" target="_blank" class="text-white text-decoration-none">
                    {{ url_for('shortener.redirect_to_url', short_url=new_url, _external=True) }}
                </a>
            </p>
        </div>

        <!-- Regenerate Shortened URL Form -->
        <form method="POST" action="{{ url_for('shortener.regenerate_url') }}" class="mb-4" style="max-width: 800px;">
            <input type="hidden" name="original_url" value="{{ original_url }}">
            <button type="submit" class="btn btn-warning">Regenerate Link</button>
        </form>

        <!-- Success Message Section -->
        <div class="card p-4" style="max-width: 800px;">
            <h2 class="card-title">Shortened URL Regenerated</h2>
            <p class="card-text">
                Original URL: 
                <a href="{{ original_url }}" target="_blank" class="text-primary text-decoration-none">
                    {{ original_url }}
                </a>
            </p>
            <p class="card-text">
                New Shortened URL: 
                <a href="{{ url_for('shortener.redirect_to_url', short_url=new_url) }}" target="_blank" class="text-primary text-decoration-none">
                    {{ new_url }}
                </a>
            </p>
            <a href="{{ url_for('shortener.index') }}" class="btn btn-primary mt-3">Go Back</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-NFjbhb9nd0/zfQlQfTDEOj70yLZ7tGBONvlLvRyxC4Tgo9J6ET0wxdGVC8F39jBC" crossorigin="anonymous"></script>
</body>
</html>
